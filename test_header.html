<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Header</title>
    <link rel="stylesheet" href="css/style.css?v=1770315462">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .debug-info {
            background: #f0f0f0;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Test de Header</h1>
    
    <div class="debug-info">
        <h2>Estado de carga:</h2>
        <p id="status">Cargando...</p>
    </div>
    
    <!-- Header común -->
    <div id="common-header"></div>
    
    <div class="debug-info">
        <h2>Contenido del header:</h2>
        <pre id="header-content"></pre>
    </div>

    <!-- JavaScript -->
    <script src="js/jquery.min.js"></script>
    <script src="js/load-common.js"></script>
    <script>
        setTimeout(function() {
            const headerDiv = document.getElementById('common-header');
            const statusP = document.getElementById('status');
            const contentPre = document.getElementById('header-content');
            
            if (headerDiv.innerHTML.trim() === '') {
                statusP.textContent = '❌ El header NO se cargó';
                statusP.style.color = 'red';
            } else {
                statusP.textContent = '✓ El header se cargó correctamente';
                statusP.style.color = 'green';
                contentPre.textContent = headerDiv.innerHTML;
            }
            
            // Verificar estilos aplicados
            const navMenu = document.querySelector('.nav-menu');
            if (navMenu) {
                const styles = window.getComputedStyle(navMenu);
                console.log('Estilos del nav-menu:', {
                    display: styles.display,
                    listStyle: styles.listStyle,
                    margin: styles.margin,
                    padding: styles.padding
                });
                
                const firstLink = document.querySelector('.nav-menu li a');
                if (firstLink) {
                    const linkStyles = window.getComputedStyle(firstLink);
                    console.log('Estilos del primer enlace:', {
                        color: linkStyles.color,
                        textDecoration: linkStyles.textDecoration,
                        padding: linkStyles.padding
                    });
                }
            }
        }, 2000);
    </script>
</body>
</html>
